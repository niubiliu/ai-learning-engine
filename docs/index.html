<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Learning Knowledge Graph</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #header {
      padding: 18px 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #header h1 { font-size: 20px; font-weight: 700; }
    #header .meta { font-size: 13px; opacity: 0.85; }
    #legend {
      display: flex;
      gap: 16px;
      padding: 10px 28px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8b949e; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    #graph { width: 100%; height: calc(100vh - 100px); }
  </style>
</head>
<body>
  <div id="header">
    <h1>AI Learning Knowledge Graph</h1>
    <div class="meta">Session #3 &nbsp;|&nbsp; 9 concepts &nbsp;|&nbsp; Updated 2026-03-06</div>
  </div>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#667eea"></div> Systems</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f093fb"></div> LLM Capabilities</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4facfe"></div> Applications</div>
    <div class="legend-item"><div class="legend-dot" style="background:#43e97b"></div> Model Principles</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fa8231"></div> Math Foundations</div>
  </div>
  <div id="graph"></div>
  <script>
    const nodesData = [
      {"id": "AI",                "label": "AI",                "group": "root",             "color": {"background": "#ffffff", "border": "#aaaaaa"}},
      {"id": "Systems",           "label": "Systems",           "group": "Systems",          "color": {"background": "#667eea", "border": "#4a5cd4"}},
      {"id": "LLM Capabilities",  "label": "LLM Capabilities",  "group": "LLM Capabilities", "color": {"background": "#f093fb", "border": "#d070e0"}},
      {"id": "Applications",      "label": "Applications",      "group": "Applications",     "color": {"background": "#4facfe", "border": "#2d8fe0"}},
      {"id": "Model Principles",  "label": "Model Principles",  "group": "Model Principles", "color": {"background": "#43e97b", "border": "#2cc45a"}},
      {"id": "Math Foundations",  "label": "Math Foundations",  "group": "Math Foundations", "color": {"background": "#fa8231", "border": "#e06010"}},
      {"id": "ai_agents",                     "label": "AI Agents",           "group": "Systems", "color": {"background": "#667eea", "border": "#4a5cd4"}},
      {"id": "multi_agent_systems",           "label": "Multi-Agent Systems", "group": "Systems", "color": {"background": "#667eea", "border": "#4a5cd4"}},
      {"id": "retrieval_augmented_generation","label": "RAG",                 "group": "Systems", "color": {"background": "#667eea", "border": "#4a5cd4"}}
    ];
    const edgesData = [
      {"from": "AI", "to": "Systems",          "label": "includes"},
      {"from": "AI", "to": "LLM Capabilities", "label": "includes"},
      {"from": "AI", "to": "Applications",     "label": "includes"},
      {"from": "AI", "to": "Model Principles", "label": "includes"},
      {"from": "AI", "to": "Math Foundations", "label": "includes"},
      {"from": "Systems", "to": "ai_agents",                     "label": "包含"},
      {"from": "Systems", "to": "multi_agent_systems",           "label": "包含"},
      {"from": "Systems", "to": "retrieval_augmented_generation","label": "包含"},
      {"from": "ai_agents", "to": "multi_agent_systems",         "label": "扩展"}
    ];

    const DOMAIN_IDS = ["Systems","LLM Capabilities","Applications","Model Principles","Math Foundations"];
    nodesData.forEach(n => {
      if (n.group === "root")            { n.level = 0; n.size = 36; n.font = { size: 16, color: "#ffffff", bold: true }; }
      else if (DOMAIN_IDS.includes(n.id)){ n.level = 1; n.size = 26; n.font = { size: 13, color: "#e6edf3" }; }
      else                               { n.level = 2; n.size = 18; n.font = { size: 12, color: "#e6edf3" }; }
    });

    const nodes = new vis.DataSet(nodesData);
    const edges = new vis.DataSet(edgesData);

    const options = {
      nodes: { shape: "dot", borderWidth: 2, shadow: true },
      edges: {
        color: { color: "#484f58", opacity: 0.9, highlight: "#667eea" },
        font: { size: 10, color: "#8b949e", align: "middle" },
        smooth: { type: "cubicBezier", forceDirection: "vertical", roundness: 0.4 },
        arrows: { to: { enabled: true, scaleFactor: 0.6 } },
        width: 1.5,
      },
      physics: { enabled: false },
      layout: {
        hierarchical: {
          enabled: true,
          direction: "UD",
          sortMethod: "directed",
          levelSeparation: 120,
          nodeSpacing: 160,
          treeSpacing: 200,
          blockShifting: true,
          edgeMinimization: true,
          parentCentralization: true,
        },
      },
      interaction: { hover: true, tooltipDelay: 150, navigationButtons: true, keyboard: true, zoomView: true, dragView: true },
    };

    new vis.Network(document.getElementById("graph"), { nodes, edges }, options);
  </script>
</body>
</html>
