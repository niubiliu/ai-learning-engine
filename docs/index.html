ion", "to": "model_context_protocol", "label": "包含"}, {"from": "infrastructure_and_integration", "to": "external_tools", "label": "包含"}, {"from": "infrastructure_and_integration", "to": "data_sources", "label": "包含"}, {"from": "Systems", "to": "system_operations", "label": "包含"}, {"from": "system_operations", "to": "context_engineering", "label": "包含"}, {"from": "system_operations", "to": "state_management", "label": "包含"}, {"from": "system_operations", "to": "caching", "label": "包含"}, {"from": "system_operations", "to": "streaming", "label": "包含"}, {"from": "system_operations", "to": "guardrails", "label": "包含"}, {"from": "system_operations", "to": "observability", "label": "包含"}, {"from": "LLM Capabilities", "to": "text_processing", "label": "包含"}, {"from": "text_processing", "to": "tokenization", "label": "包含"}, {"from": "text_processing", "to": "context_window", "label": "包含"}, {"from": "text_processing", "to": "text_generation", "label": "包含"}, {"from": "LLM Capabilities", "to": "prompting", "label": "包含"}, {"from": "prompting", "to": "prompt_engineering", "label": "包含"}, {"from": "prompting", "to": "system_prompt", "label": "包含"}, {"from": "prompting", "to": "few_shot_prompting", "label": "包含"}, {"from": "prompting", "to": "chain_of_thought_prompting", "label": "包含"}];

      n.size  = SIZE_MAP[lv] || 14;
      n.font  = { size: FONT_MAP[lv] || 11, color: "#e6edf3" };
