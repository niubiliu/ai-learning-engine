name: Daily AI Learning Email

on:
  schedule:
    # 08:00 Beijing time = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab (useful for testing)

permissions:
  contents: write

jobs:
  daily-learning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send learning email
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_PAGES_URL:   https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/generate_and_send.py

      - name: Commit updated state and knowledge graph
        run: |
          git config --local user.email "ai-learning-bot@users.noreply.github.com"
          git config --local user.name "AI Learning Bot"
          git add state/progress.json docs/index.html
          git diff --staged --quiet || git commit -m "Learning Session #${{ github.run_number }} - $(date +'%Y-%m-%d')"
          git push
